schema: praxec.repo/v1
name: cognitive-architectures
namespace: cognitive
version: 0.0.1
# Compatibility: requires praxec 0.0.22 or later. The flows resolve the target
# repo as run-ambient `$.run.repo_root` (0.0.21) rather than a hand-threaded
# `repo_path`, and `flow.drive-program` routes per-deliverable via the per-spawn
# `repoRoot` override (0.0.22); both need the 0.0.22 scope validator. The
# capability/orchestrator composition model itself is SPEC §9 (0.0.14+).
description: |
  The canonical first resource repo for the praxec
  capability/orchestrator composition model (SPEC §9).

  Ships the lifecycle orchestrators (flow.*) and the capabilities
  (cap.*) they depend on. Operators reference this repo from their
  gateway config via:

      repos:
        - path: /path/to/cognitive-architectures

  Every loaded definitionId is namespace-prefixed `cognitive/<id>`
  (e.g. `cognitive/flow.add-feature`, `cognitive/cap.plan.vet`).

  The manifest exposes `capabilities/`, `orchestrators/`, `skills/`, and
  `scripts-library/`. The demo content under `workflows/`, `agents/`,
  `patterns/`, and `examples/` stays outside this manifest's layout and
  loads via the `include:` path so existing operators don't break on
  upgrade.

# The default layout field names (`capabilities/`, `orchestrators/`,
# `skills/`, `scripts/`, `connections/`) mostly match the directory
# names, so we only override the ones that differ.
layout:
  capabilities:  capabilities
  # Engine layout field is `flows`; the directory remains `orchestrators/`.
  flows:         orchestrators
  skills:        skills
  scripts:       scripts-library
  # Connections stay outside the manifest — operators wire their own MCP /
  # CLI endpoints in the gateway config. The connections/ tree contains
  # REFERENCE connection definitions operators copy into their config
  # rather than loading wholesale.
  connections:   ._unused_v02_connections

# The `connections/` default dir holds reference templates this manifest remaps
# away (above) and never loads. Declare it reference-only so `check`/`serve` don't
# warn UNSCANNED_DEFINITION_DIR on the by-design layout.
reference_only:
  - connections

# The model requirement TRAVELS with the pack (praxec 0.0.48+): these OPEN
# affinity keys have no default-chain fallback, so an operator who mounts this
# pack must bind them in their models.yaml `activity:` block. `check`/`doctor`
# read this block to surface the recommendation + `praxec models bind <affinity>`
# instead of silently falling back to the commodity default. Recommendations are
# swappable (the operator's key/cost stays authoritative), not hard pins. Both
# review affinities are COMMODITY by standing owner directive — nothing in the
# review chain may be pegged to a frontier model.
affinities:
  review:
    tier: commodity
    capability: >-
      Senior structured-findings review with producer≠evaluator separation
      (assertion quality, plan vetting). Commodity-only by directive; deepseek-v4-pro
      leads as the reliable structured-findings converger.
    recommended: openrouter/deepseek/deepseek-v4-pro
  react-review:
    tier: commodity
    capability: >-
      The React anti-pattern review gate, split from `review` so `review` can run
      effort-safe (glm→kimi) while this gate stays on a converging deepseek lead.
    recommended: openrouter/deepseek/deepseek-v4-pro
