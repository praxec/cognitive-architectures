version: "1.0.0"
scripts:
  inspect.docs-fmeca.inventory:
    verb: inspect
    lifecycle: experimental
    source: cognitive-architectures
    body: |
      #!/usr/bin/env python3
      # Deterministic review-queue builder for flow.review.docs-fmeca.
      #
      # Enumerates the DOCS (*.md/mdx/markdown) and SCRIPTS (*.sh/*.ps1/
      # *.bash, plus *.py/*.mjs/*.js under a scripts*/ or tools/ dir) beneath
      # the run's repo root (scripts run FROM repo_root), classifies each,
      # and emits the capped review queue: docs first (shallowest paths —
      # READMEs — lead), scripts reserved ~1/3 of the budget so a doc-heavy
      # repo cannot starve the script-organization lens. Each item carries
      # BOTH the repo-relative path (report identity) and the absolute path
      # (markdown-administrator reads the filesystem directly from the
      # gateway process, whose cwd is NOT repo_root).
      #
      # Arg $1 = doc_globs (JSON array of posix-relative fnmatch globs; []
      #          = built-in classification over the whole tree).
      # Arg $2 = max_items (integer >= 1).
      # Stdout: {"queue": [{id, path, abs_path, kind, bytes}...],
      #          "queue_count": N, "index": 0, "doc_count": D,
      #          "script_count": S}
      # FAIL-CLOSED: an empty inventory exits non-zero — reviewing zero
      # docs must never render as a clean report (the silent false
      # negative this flow exists to not produce).
      import fnmatch, json, os, sys

      def die(msg):
          print(json.dumps({"error": msg}), file=sys.stderr)
          sys.exit(1)

      raw_globs = sys.argv[1] if len(sys.argv) > 1 else "[]"
      raw_max = sys.argv[2] if len(sys.argv) > 2 else "12"
      try:
          globs = json.loads(raw_globs) if raw_globs.strip() else []
      except ValueError as e:
          die(f"doc_globs is not valid JSON: {e}")
      if globs is None:
          globs = []
      if not isinstance(globs, list) or not all(isinstance(g, str) for g in globs):
          die("doc_globs must be a JSON array of strings")
      try:
          max_items = int(json.loads(raw_max))
      except (ValueError, TypeError) as e:
          die(f"max_items is not an integer: {e}")
      if max_items < 1:
          die("max_items must be >= 1")

      SKIP_DIRS = {".git", "node_modules", "target", "dist", "build", "out",
                   "vendor", ".corpus", ".praxec", "__pycache__", ".venv",
                   "venv", "bin", "obj", ".next", "coverage"}
      DOC_EXT = {".md", ".mdx", ".markdown"}
      SCRIPT_EXT = {".sh", ".bash", ".ps1"}
      SCRIPT_DIR_EXT = {".py", ".mjs", ".js", ".cjs"}
      SCRIPT_DIR_HINTS = ("scripts", "script", "tools", "bin", "ci")

      root = os.getcwd()
      docs, scripts = [], []
      for dirpath, dirnames, filenames in os.walk(root):
          dirnames[:] = sorted(d for d in dirnames if d not in SKIP_DIRS)
          for name in sorted(filenames):
              full = os.path.join(dirpath, name)
              rel = os.path.relpath(full, root).replace(os.sep, "/")
              if globs and not any(fnmatch.fnmatch(rel, g) for g in globs):
                  continue
              ext = os.path.splitext(name)[1].lower()
              in_script_dir = any(seg in SCRIPT_DIR_HINTS
                                  for seg in rel.lower().split("/")[:-1])
              if ext in DOC_EXT:
                  kind = "doc"
              elif ext in SCRIPT_EXT or (ext in SCRIPT_DIR_EXT and in_script_dir):
                  kind = "script"
              else:
                  continue
              try:
                  size = os.path.getsize(full)
              except OSError:
                  continue
              if size == 0:
                  continue
              item = {"id": rel, "path": rel, "abs_path": full,
                      "kind": kind, "bytes": size}
              (docs if kind == "doc" else scripts).append(item)

      if not docs and not scripts:
          die("inventory is empty: no docs or scripts matched under "
              f"{root} (globs={globs!r}) — refusing to emit a queue that "
              "would render as a clean review of nothing")

      # Shallow-first, then lexicographic: README.md leads its tree.
      docs.sort(key=lambda i: (i["path"].count("/"), i["path"]))
      scripts.sort(key=lambda i: (i["path"].count("/"), i["path"]))

      script_quota = min(len(scripts), max(1, max_items // 3)) if scripts else 0
      doc_quota = min(len(docs), max_items - script_quota)
      # Re-fill script slots if docs cannot use the whole doc quota.
      script_quota = min(len(scripts), max_items - doc_quota)
      queue = docs[:doc_quota] + scripts[:script_quota]

      print(json.dumps({
          "queue": queue,
          "queue_count": len(queue),
          "index": 0,
          "doc_count": doc_quota,
          "script_count": script_quota,
      }))
