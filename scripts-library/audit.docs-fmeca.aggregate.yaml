version: "1.0.0"
scripts:
  audit.docs-fmeca.aggregate:
    verb: audit
    lifecycle: experimental
    source: cognitive-architectures
    body: |
      #!/usr/bin/env python3
      # Code-computed rollup for flow.review.docs-fmeca — the aggregate an
      # agent is never allowed to self-assert. Joins:
      #   - the fmeca-mcp `analyze` report (computed criticality/residual/
      #     standing/response_class per failure mode + risk_ranking/ready/
      #     blockers),
      #   - the lens index (fm id → role_lens/item/mitigations carriage),
      #   - the deterministic probe results (exit-code evidence),
      #   - the script-organization rows,
      #   - the unscored rows the batch step partitioned out,
      # into ONE ranked report + the remediation checklist, and recomputes
      # every scalar the flow's outcomes gate on:
      #   fm_total                — scored + unscored row count (>= 0 iff
      #                             this rollup actually ran; the flow
      #                             seeds -1 as the honest floor).
      #   probe_break_count       — executed probes with nonzero exit (the
      #                             documented step does not work as
      #                             written) — computed from the runner's
      #                             records, not from anyone's claim.
      #   probe_unevaluated_count — safe-classified probes that did NOT
      #                             execute (denylist veto / path escape /
      #                             budget) — "we could not look", kept
      #                             separate from "nothing broke".
      #
      # Args: $1 fmeca_report, $2 lens_index, $3 probe_results,
      #       $4 script_org, $5 unscored_rows (all JSON; spill contract
      #       honored via arg()).
      # Stdout: {"report": {...}, "remediation_checklist": [...],
      #          "fm_total": N, "probe_break_count": N,
      #          "probe_unevaluated_count": N, "fmeca_ready": bool}
      import json, os, sys

      def arg(i, default=""):
          v = sys.argv[i] if len(sys.argv) > i else default
          spilled = json.loads(os.environ.get("PRAXEC_SPILLED_ARGS", "[]"))
          if (i - 1) in spilled and isinstance(v, str) and v.startswith("@argfile:"):
              with open(v[len("@argfile:"):]) as f:
                  return f.read()
          return v

      def load(i, default):
          raw = arg(i, "")
          if not isinstance(raw, str):
              return raw if raw is not None else default
          if not raw.strip():
              return default
          try:
              val = json.loads(raw)
          except ValueError:
              return default
          return val if val is not None else default

      fmeca_report = load(1, {})
      lens_index = load(2, {})
      probe_results = load(3, [])
      if isinstance(probe_results, dict):
          probe_results = probe_results.get("results", [])
      script_org = load(4, [])
      unscored_rows = load(5, [])

      scored = {fm.get("id"): fm
                for fm in (fmeca_report.get("failure_modes") or [])
                if isinstance(fm, dict)}
      ranking = [r for r in (fmeca_report.get("risk_ranking") or [])
                 if isinstance(r, str)]
      # risk_ranking is the engine's order; append any scored id it missed
      # so nothing silently drops out of the report.
      ordered = ranking + [i for i in scored if i not in set(ranking)]

      probes_by_fm, probes_by_item = {}, {}
      for pr in probe_results:
          if not isinstance(pr, dict):
              continue
          if pr.get("fm_id"):
              probes_by_fm.setdefault(pr["fm_id"], []).append(pr)
          if pr.get("item"):
              probes_by_item.setdefault(pr["item"], []).append(pr)

      findings = []
      for rank, fm_id in enumerate(ordered, start=1):
          fm = scored.get(fm_id, {})
          carry = lens_index.get(fm_id, {}) if isinstance(lens_index, dict) else {}
          evidence = probes_by_fm.get(fm_id, [])
          findings.append({
              "rank": rank,
              "fm_id": fm_id,
              "item": carry.get("item", ""),
              "role_lens": carry.get("role_lens", ""),
              "failure_class": carry.get("failure_class", ""),
              "description": carry.get("description", ""),
              "cause": carry.get("cause", ""),
              "effect": carry.get("effect", ""),
              "criticality": fm.get("criticality"),
              "residual_criticality": fm.get("residual_criticality"),
              "standing": fm.get("standing"),
              "response_class": fm.get("response_class"),
              "issues": fm.get("issues", []),
              "mitigations": carry.get("mitigations", []),
              "probe_evidence": [
                  {k: p.get(k) for k in ("id", "command", "status",
                                         "exit_code", "stderr_tail",
                                         "veto_reason", "expectation")}
                  for p in evidence],
          })
      for row in unscored_rows:
          if not isinstance(row, dict):
              continue
          findings.append({
              "rank": None,
              "fm_id": row.get("id", ""),
              "item": (row.get("component") or {}).get("id", ""),
              "role_lens": row.get("role_lens", ""),
              "failure_class": row.get("failure_class", ""),
              "description": row.get("description", ""),
              "criticality": "unscored",
              "unscored_reason": row.get("unscored_reason", ""),
              "mitigations": row.get("mitigations", []),
              "probe_evidence": [],
          })

      checklist = []
      for f in findings:
          for m in f.get("mitigations") or []:
              if not isinstance(m, dict):
                  continue
              checklist.append({
                  "rank": f["rank"],
                  "criticality": f.get("criticality"),
                  "item": f.get("item"),
                  "role_lens": f.get("role_lens"),
                  "fm_id": f.get("fm_id"),
                  "kind": m.get("kind"),
                  "fix": m.get("description"),
              })
      # Executed breaks with no linked failure mode still demand action —
      # an unattributed break is a finding the reviewers missed.
      linked = {p.get("id") for f in findings for p in f["probe_evidence"]}
      for pr in probe_results:
          if (isinstance(pr, dict) and pr.get("status") == "executed_fail"
                  and pr.get("id") not in linked):
              checklist.append({
                  "rank": None,
                  "criticality": "unattributed-break",
                  "item": pr.get("item"),
                  "role_lens": "",
                  "fm_id": pr.get("fm_id", ""),
                  "kind": "detection",
                  "fix": ("documented step broke under execution with no "
                          f"linked failure mode: `{pr.get('command')}` "
                          f"(exit {pr.get('exit_code')}) — triage and file"),
              })
      checklist.sort(key=lambda c: (c["rank"] is None, c["rank"] or 0))

      status_counts = {}
      for pr in probe_results:
          if isinstance(pr, dict):
              s = pr.get("status", "unknown")
              status_counts[s] = status_counts.get(s, 0) + 1
      breaks = status_counts.get("executed_fail", 0)
      unevaluated = (status_counts.get("vetoed_denylist", 0)
                     + status_counts.get("vetoed_path_escape", 0)
                     + status_counts.get("skipped_budget", 0))

      by_criticality = {}
      for f in findings:
          c = str(f.get("criticality"))
          by_criticality[c] = by_criticality.get(c, 0) + 1

      dangerous_scripts = [s for s in script_org
                           if isinstance(s, dict)
                           and s.get("danger_level") == "destructive"]
      buried_scripts = [s for s in script_org
                        if isinstance(s, dict)
                        and s.get("discoverability") in ("buried", "undocumented")]

      report = {
          "findings": findings,
          "remediation_checklist": checklist,
          "script_organization": {
              "assessments": script_org,
              "destructive": dangerous_scripts,
              "poorly_discoverable": buried_scripts,
          },
          "probe_results": probe_results,
          "probe_status_counts": status_counts,
          "by_criticality": by_criticality,
          "fmeca": {
              "ready": bool(fmeca_report.get("ready", False)),
              "blockers": fmeca_report.get("blockers", []),
              "risk_ranking": ranking,
              "matrix_strategy": fmeca_report.get("matrix_strategy"),
          },
          "totals": {
              "fm_scored": len(scored),
              "fm_unscored": len(unscored_rows),
              "fm_total": len(scored) + len(unscored_rows),
              "probe_break_count": breaks,
              "probe_unevaluated_count": unevaluated,
          },
      }

      print(json.dumps({
          "report": report,
          "remediation_checklist": checklist,
          "fm_total": len(scored) + len(unscored_rows),
          "probe_break_count": breaks,
          "probe_unevaluated_count": unevaluated,
          "fmeca_ready": bool(fmeca_report.get("ready", False)),
      }))
