# examples/backfill-session-findings.yaml
#
# Gateway config that DRIVES cognitive/flow.findings-to-tickets to back-fill
# a small slice of PRIOR-SESSION findings — the plan Task 5 back-fill
# vehicle. Source: the target repo's own hands-on QA record,
# `Docs/superpowers/specs/2026-07-31-deep-qa-findings.md` ("Sales CRM
# cluster" BLOCKERS B1/B3/B4), converted into the {finding, enrichment}
# shape flow.findings-to-tickets/cap.run.ticket-upsert consume — real
# defects, real Expected-behavior citations, not placeholder data.
#
# Unlike qa-promote-run.yaml / qa-explore-run.yaml, this run needs NO
# `agents:`/`models_yaml` binding and NO browser pool: flow.findings-to-
# tickets and every cap it calls (cap.run.ticket-upsert) are fully
# deterministic `kind: script` chains — no agent state anywhere in this
# flow's graph. `_writableRepos` still needs at least one entry (the
# engine will not start a run without one) even though none of these
# scripts touch the local filesystem — every mutation here is `gh api
# graphql` against the operator's own GitHub auth.
#
# BACKFILL DATA-HONESTY NOTE: these three findings were captured by a
# human-driven, Playwright-assisted hands-on QA pass (one deterministic
# repro each), not by the automated flow.qa.explore probe-replay gate —
# so `reproduction.attempts/successfulAttempts` (2/2) and `probe_ref`
# below characterize that manual verification, not a literal replayable
# Playwright spec on disk. cap.diagnose.finding's own inputSchema
# (`successfulAttempts >= 2`) is NOT re-validated on this path — that gate
# only fires for LIVE agent submissions through cap.diagnose.finding
# itself; a back-fill converts already-adjudicated historical findings
# directly into the Finding shape and skips that cap entirely (by design
# — see docs/design-ticket-lifecycle-workflows.md "Components").
# `probe_ref`/`expectedSource.reference` cite the doc section that IS the
# reproduction record for these three.
#
# Validate:
#   praxec check --config examples/backfill-session-findings.yaml
#
