#
# Re-running this SAME input is the dedup proof (plan Task 5 Step 3): the
# qa-fingerprint computed from repo|area|route|normalized(title) is
# identical across runs, so a second drive returns `action: updated` for
# all three (no duplicate issues), not `action: created`.

version: "1.0.0"

praxec:
  # No filesystem work happens in this run (every mutation is `gh api
  # graphql`) but the engine still requires at least one writable repo to
  # start a run.
  _writableRepos:
    - root: "."
      push: false

audit:
  sink: stderr

store:
  kind: sqlite
  path: /home/mc/.local/share/praxec/backfill-session-findings.db

# The cognitive-architectures resource repo: flow.findings-to-tickets +
# cap.run.ticket-upsert + the inspect.github.*/inspect.ticket.*/
# run.github.* scripts it composes.
repos:
  - path: ..
