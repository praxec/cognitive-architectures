# orchestrators/flow.implement.deliverable.yaml
#
# Execute ONE plan deliverable end-to-end, then record it in the durable plan
# tracker. This is now a THIN WRAPPER over the reusable change atom
# (flow.change): it composes flow.change (the whole plan→execute→verify + honest
# definition-of-done envelope) and adds the ONLY consumer-specific concern this
# flow owns — the cpm-planner `plan.mark_status` completion effect (CAS; caller
# must hold the cohort lock).
#
#   changing        → run flow.change on the deliverable (stack-appropriate
#                     build + verify, honest DoD). It re-surfaces the same
#                     behavior this flow used to inline: ts deliverables build
#                     via flow.implement.ts-slice, rust/dotnet via the cargo
#                     build-loop; the honest file-change measure + stack verify
#                     + opt-in React gate all live inside the atom. flow.change
#                     reads its own $.run.repo_root (inherited verbatim from this
#                     run — no repoRoot override) so every inner state sees the
#                     SAME root as before; backstop_cwd / verify_scope /
#                     react_review pass straight through.
#   change_gate     → the DoD handoff, first-class at the wrap boundary: mark
#                     ONLY when BOTH outcomes hold (real files changed AND the
#                     verifier passed). flow.change already routes any no-op /
#                     verifier-fail / unknown-stack / blocking-React-finding to
#                     its own `failed` terminal — and a failed sub-workflow makes
#                     THIS `changing` transition error (the mission fails, mark
#                     never runs), so reaching change_gate already implies the
#                     DoD was met. This explicit gate makes the handoff visible
#                     and is fail-fast defense-in-depth.
#   marking_complete→ cpm-planner `plan.mark_status` complete (compare-and-swap;
#                     the caller must hold the deliverable's cohort lock —
#                     `caller_id`). LOCK_NOT_HELD / a CAS conflict fails the run.
#
# BEHAVIOR PRESERVATION: the DoD-level behavior is unchanged from the pre-wrap
# flow. Same top-level `outcomes:` (keyed on impl_files_changed >= 1 AND
# ws_verify.status == 'pass', now populated from flow.change's outputs). Same
# failure modes: a no-op ⇒ failed, a verifier rejection ⇒ failed, an undetected
# stack ⇒ failed, a blocking React finding ⇒ failed — all now enforced INSIDE
# flow.change and propagated by the sub-workflow failure contract (the child's
# `failed` terminal → this transition errors → this mission fails, so
# mark_status never runs). The stack routing, the SCOPED-VS-BARRIER verify_scope
# semantics, and the opt-in React gate all live in flow.change now (see its
# header) — no duplicated envelope logic remains here.
#
# This is a FLOW (not a capability): only flows may invoke other workflows via
# `kind: workflow` (SPEC §3/§4.1, V6/V10). It is the execution LEAF the cohort
# driver (flow.execute-cohorts) calls per acquired deliverable; flow.loom
# composes elicit → design → plan → cohorts on top. The build-loop already
# escalates models on review failure and surfaces to a human at its cap, so this
# flow does not re-implement recovery — it couples a verified change (flow.change)
# to the durable status transition (earned value).
#
# Requires the `cpm-planner` connection (see connections/cpm-planner.yaml) and
# the reusable `flow.change` atom (orchestrators/flow.change.yaml).

workflows:
  flow.implement.deliverable:
    lifecycle: experimental
    description: >
      Build one plan deliverable via the reusable change atom (flow.change),
      then mark it complete in cpm-planner (CAS; caller must hold the cohort
      lock) once the atom's honest definition-of-done is met. The execution leaf
      the cohort driver calls per acquired deliverable.
    inputs:
      # The deliverable spec — passed straight through to flow.change as the
      # change spec (goal + deliverables/steps + acceptance_criteria +
      # owned_files/stack/cargo_scope).
      deliverable:    { type: object, required: true }
      # CROSS-CRATE BACKSTOP surface, threaded to flow.change verbatim (it drives
      # both the child build-loop re-root and the rust/dotnet verify cwd). Was
      # hardcoded to repo_path — always correct, but it pays for a full
      # `cargo test --workspace` on every deliverable. REQUIRED (not defaulted):
      # a path default in `inputs:` is not merged into `$.workflow.input` for path
      # resolution, so a defaulted-but-unpassed value is an unresolved-arg
      # permanent error, not a silent fallback. Pass repo_path for the
      # always-correct whole-tree gate, or narrow it to the crate(s) that
      # reverse-depend on the touched one — but it MUST be a SUPERSET of the inner
      # loop's `cargo_scope` surface (see flow.change's header).
      backstop_cwd:   { type: string, required: true }
      # OPTIONAL per-slice narrowing for the ts/dotnet verify arms, threaded to
      # flow.change. "" (default) = unchanged full backstop. Declared with a
      # default so callers that predate this input (flow.drive-program) don't
      # need to change.
      verify_scope:   { type: string, default: "" }
      # OPT-IN diff-scoped React anti-pattern gate on the TS arm only, threaded to
      # flow.change. false (default) = OFF: every existing caller that omits it
      # gets the exact prior behavior (no gate; ts pass → mark). true = fail the
      # deliverable on a new correctness-class React finding, before mark.
      react_review:   { type: boolean, default: false }
      # cpm-planner coordinates: which plan/deliverable, and the lock holder.
      plan_id:        { type: string, required: true }
      deliverable_id: { type: string, required: true }
      caller_id:      { type: string, required: true }
    # `status` for plan.mark_status is an internally-tagged OBJECT
    # ({"status":"complete"}); a map: binding can't build an object literal, so
    # seed it here and bind it by path. base_commit / impl_files_changed /
    # ws_verify are the HONEST completion evidence: seeded here, then OVERWRITTEN
    # by flow.change's `use.outputs` in `changing` (below). Seeding ws_verify with
    # a non-'pass' status means change_gate is fail-closed if the atom ever
    # returned without setting it.
    initialContext:
      status_complete: { status: complete }
      base_commit: ""
      impl_files_changed: 0
      ws_verify: { status: "" }
    # HONEST definition of done (deterministic `met` flags) — UNCHANGED from the
    # pre-wrap flow: a deliverable is only complete when BOTH real files changed
    # AND the stack-appropriate verifier passed on them. These `met` flags now
    # read the evidence flow.change projects into this context via `use.outputs`.
    outcomes:
      - id: implement_changed_files
        statement: >
          The implement step produced real file changes (committed slices or
          on-disk work), not a no-op.
        check: "$.context.impl_files_changed >= 1"
      - id: workspace_verified
        statement: >
          The stack-appropriate verifier (ts | rust | dotnet) passed. Full
          workspace/solution when verify_scope is "" (the default); scoped to
          the deliverable's affected test(s)/project when the caller opted into
          the scoped path (ts/dotnet only). A scoped pass here is NOT the plan's
          final word for that caller: its driver (e.g. flow.execute-cohorts)
          still owes the ONE full-suite barrier at plan close.
        check: "$.context.ws_verify.status == 'pass'"
    initialState: changing
    states:

      # Run the reusable change atom on this deliverable: stack-appropriate build
      # (ts-slice | cargo build-loop) → honest file-change measure → stack verify
      # → opt-in React gate → honest DoD. NO repoRoot override: flow.change
      # inherits this run's $.run.repo_root verbatim, so its baselining /
      # measuring_impl / detecting_stack / verify_ts states see the SAME repo root
      # this flow used inline before, while its `building` / verify_rust /
      # verify_dotnet states re-root to backstop_cwd from the input threaded here.
      # On success flow.change projects the DoD-evidence (base_commit,
      # impl_files_changed, ws_verify) into this context via `use.outputs`; on any
      # failure path the child ends `failed`, this transition errors, and the
      # mission fails (mark_status never runs) — the preserved failure contract.
      changing:
        goal: Run the reusable change atom (build + verify + honest DoD) on the deliverable.
        transitions:
          change:
            target: change_gate
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/flow.change
              use:
                inputs:
                  deliverable:  "$.workflow.input.deliverable"
                  backstop_cwd: "$.workflow.input.backstop_cwd"
                  verify_scope: "$.workflow.input.verify_scope"
                  react_review: "$.workflow.input.react_review"
                outputs:
                  "$.context.base_commit":        base_commit
                  "$.context.impl_files_changed": impl_files_changed
                  "$.context.ws_verify":          ws_verify

      # DoD HANDOFF GATE: mark complete ONLY when BOTH of flow.change's outcomes
      # hold (real files changed AND the verifier passed). Exhaustive:
      # proceed | blocked. Reaching this state already implies the DoD was met
      # (flow.change routes every failure to its own `failed` terminal, which
      # errors the `changing` transition), so `blocked` is fail-closed
      # defense-in-depth — never a silent complete on unmet outcomes.
      change_gate:
        transitions:
          proceed:
            target: marking_complete
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.impl_files_changed >= 1" }
              - { kind: expr, expr: "$.context.ws_verify.status == 'pass'" }
          blocked:
            target: failed
            actor: deterministic

      # Record the verified deliverable as complete in the durable tracker.
      # CAS + lock-ownership are enforced by cpm-planner (fail-fast on conflict).
      marking_complete:
        goal: Mark the deliverable complete in cpm-planner (earned value).
        transitions:
          mark:
            target: done
            actor: deterministic
            executor:
              kind: mcp
              connection: cpm-planner
              tool: plan.mark_status
              map:
                plan_id:        "$.workflow.input.plan_id"
                deliverable_id: "$.workflow.input.deliverable_id"
                caller_id:      "$.workflow.input.caller_id"
                status:         "$.context.status_complete"
            output:
              mark_result: "$.output"

      done:
        terminal: true
        outcome: success

      # Reached from an unmet DoD at change_gate (defense-in-depth; the normal
      # failure path is flow.change failing and erroring the `changing`
      # transition, which fails this mission directly). Fail loud (outcome:
      # failure) rather than silently mark — the deliverable reverts to ready and
      # is re-driven (or circuit-breaks at MAX_ATTEMPTS).
      failed:
        terminal: true
        outcome: failure
