# orchestrators/flow.shared.mini-vee.yaml
#
# Shared MICRO-WATERFALL (the mini-Vee TDD atom, docs/sebok-flow-design.md):
#
#   sketching → cap.plan.technical-design (requirement → increment design sketch)
#   changing  → flow.change               (the reusable change atom: stack-
#                                          appropriate build-loop + honest
#                                          file-change measure + independent
#                                          verify — build AND verify now live
#                                          INSIDE the atom, not inlined here)
#   change_gate → tri-state gate on $.context.verify_report.status (the atom's
#                                          ws_verify verdict, mapped onto this
#                                          flow's existing verify_report slot)
#
# This is the atomic decomposition unit of the commodity-model hypothesis: if a
# commodity model can't drive a step, split the step — don't reach for a bigger
# model. It is reusable by BOTH flow.sebok (stage 5, Implementation) and the
# existing SDLC flows (a drop-in for a raw cap.implement.build-loop call when
# the caller wants the sketch + independent-verify bookends).
#
# This is a FLOW (not a capability): it invokes other workflows via
# `kind: workflow`, and capabilities are composition leaves — so it lives in
# orchestrators/ (the design doc's `capabilities/_shared.mini-vee.yaml` naming
# predates that rule).
#
# WRAPS THE REUSABLE CHANGE ATOM (orchestrators/flow.change.yaml, the SECOND
# consumer after flow.implement.deliverable): mini-vee's deliverable is
# `$.context.sketch`, a cap.plan.technical-design output — it does NOT carry a
# `cargo_scope` key the way a cpm deliverable does. flow.change now accepts
# cargo_scope as its OWN top-level input, decoupled from the deliverable
# object, precisely so a consumer like this one can wrap it. backstop_cwd is
# threaded as `$.run.repo_root` (mini-vee is rust/full-workspace, so the repo
# root IS the correct cross-crate backstop); min_tests is NOT passed — the
# atom fixes it to 1 internally (this flow's own prior default), so it is
# dropped here as a no-op knob. The `result` / `tests_added` outputs are also
# dropped: flow.change does not expose them, and a repo-wide check confirmed
# they were dead captures in mini-vee's only consumer (flow.sebok).
#
# Requires (cognitive/*): cap.plan.technical-design, flow.change.

workflows:
  flow.shared.mini-vee:
    lifecycle: experimental
    description: >
      Shared micro-waterfall (mini-Vee TDD atom): requirement → increment
      design sketch → the reusable change atom (flow.change: stack-appropriate
      build-loop + honest file-change measure + independent verify) → tri-state
      gate. The atomic unit both flow.sebok and the SDLC flows decompose
      implementation into.
    inputs:
      # The increment's requirement/spec object (what to build + why; ideally
      # carries acceptance criteria for the build-loop's end-of-plan review).
      requirement: { type: object, required: true }
      # SCOPED inner build-loop narrowing, threaded straight through to
      # flow.change's own cargo_scope input (declared there precisely so a
      # deliverable without the key — this flow's design sketch — can still
      # wrap the atom). "" (default) = full-workspace inner loop. Declared here
      # AND passed explicitly below — a snippet-input default is NOT merged
      # into `$.workflow.input` for path resolution when a sub-workflow is
      # invoked via `use.inputs`, so the CALLER of this flow must also pass it.
      cargo_scope: { type: string, default: "" }
    # Top-level outputs (flows have no `snippet:`) — the terminal context slots
    # a `kind: workflow` parent reads via `use.outputs`. `result` / `tests_added`
    # are NOT exposed: flow.change (the new `changing` executor) does not emit
    # them, and they were dead captures in the only consumer (flow.sebok).
    outputs:
      sketch:        { type: object }
      # Named verify_report (NOT `verify`): $.context.verify is an ENGINE-OWNED
      # slot key reserved for hop_slot-declared transitions, so a plain
      # kind:workflow verify invocation must land on a non-slot key.
      verify_report: { type: object }
    initialState: sketching
    states:

      # LEFT LEG (increment scale): sketch the increment's design from the
      # requirement — the trace record requirement → design-sketch. The sketch
      # is the plan the change atom consumes (each mini-Vee artifact feeds the
      # next).
      sketching:
        goal: Sketch the increment's technical design from the requirement.
        transitions:
          sketch:
            target: changing
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/cap.plan.technical-design
              use:
                inputs:
                  spec: "$.workflow.input.requirement"
                outputs:
                  "$.context.sketch": design

      # BOTTOM + RIGHT LEG (increment scale), now the reusable change atom:
      # stack-appropriate build (engine-observed failing-test → minimal-impl,
      # ENGINE-OBSERVED red/green, QA-reviewed, committed per slice) → honest
      # file-change measure → independent verify (canonical verifyOut) — all
      # INSIDE flow.change. backstop_cwd = $.run.repo_root (mini-vee is
      # rust/full-workspace; the repo root IS the correct cross-crate
      # backstop). min_tests is NOT passed: flow.change fixes it to 1
      # internally (this flow's own prior default), so a no-op knob would
      # remain if it were kept. ws_verify maps onto this flow's existing
      # verify_report output slot — its `.status` drives change_gate, same
      # as the old verify_gate did.
      changing:
        goal: Build + verify the sketched increment via the reusable change atom.
        transitions:
          change:
            target: change_gate
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/flow.change
              use:
                inputs:
                  deliverable:  "$.context.sketch"
                  backstop_cwd: "$.run.repo_root"
                  cargo_scope:  "$.workflow.input.cargo_scope"
                outputs:
                  "$.context.verify_report": ws_verify

      # Gate on the typed tri-state: `== 'pass'` is the ONLY positive arm; any
      # non-pass status (fail | not_evaluated) falls through the unguarded
      # `abort` default — never silently treated as a pass. Same shape as the
      # old verify_gate; belt-and-braces, since flow.change ALSO fails
      # internally on a no-op/verifier-fail (a failed sub-workflow errors the
      # `changing` transition before this gate is ever reached in that case).
      change_gate:
        transitions:
          advance:
            target: done
            actor: deterministic
            guards:
              - kind: expr
                expr: "$.context.verify_report.status == 'pass'"
          abort:
            target: failed
            actor: deterministic

      done:
        terminal: true

      failed:
        terminal: true
        outcome: failure
