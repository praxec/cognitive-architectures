# orchestrators/flow.bugfix-from-error-log.yaml
#
# State-shape note: see flow.add-feature.yaml for the execute+branch
# split pattern. Same applies here.

workflows:
  flow.bugfix-from-error-log:
    description: |
      Drive a bugfix from an inbound error log / stack trace through
      diagnosis, scope-bounded edit, regression verification, review,
      and PR open.
    inputs:
      error_log: { type: string, required: true }
      base_ref:  { type: string, default: main }
    initialState: parsing
    states:
      parsing:
        transitions:
          parse:
            target: reproducing
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cap.diagnose.parse-error
              use:
                inputs:
                  error_log: "$.context.error_log"
                outputs:
                  "$.context.parsed": parsed

      reproducing:
        transitions:
          repro:
            target: localizing
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cap.diagnose.reproduce
              use:
                inputs:
                  parsed: "$.context.parsed"
                outputs:
                  "$.context.repro_steps": repro_steps

      localizing:
        transitions:
          localize:
            target: planning
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cap.diagnose.localize
              use:
                inputs:
                  parsed:      "$.context.parsed"
                  repro_steps: "$.context.repro_steps"
                outputs:
                  "$.context.defect_location": defect_location

      planning:
        transitions:
          plan:
            target: changing
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cap.plan.fix
              use:
                inputs:
                  defect_location: "$.context.defect_location"
                  repro_steps:     "$.context.repro_steps"
                outputs:
                  "$.context.fix_plan": plan

      # Run the reusable change atom (flow.change) in place of the old
      # implementing/verifying pair: build_mode:"scope-bounded" routes its
      # build_gate to the SAME cap.implement.scope-bounded this flow called
      # directly before (deliverable = fix_plan, threaded to BOTH its `plan`
      # and `scope_paths`, matching the old implementing state); verify_mode:
      # "regression" routes its stack_gate to the SAME cap.verify.
      # regression-tests, fed the SAME defect_location/repro_steps this flow's
      # diagnostic prefix already produced. flow.change's honest DoD
      # (impl_files_changed >= 1 AND ws_verify.status == 'pass') replaces the
      # old `verified` gate's single regression_ok check.
      changing:
        goal: Run the reusable change atom (scope-bounded build + regression verify) on the fix plan.
        transitions:
          change:
            target: change_gate
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/flow.change
              use:
                inputs:
                  deliverable:     "$.context.fix_plan"
                  backstop_cwd:    "$.run.repo_root"
                  build_mode:      "scope-bounded"
                  verify_mode:     "regression"
                  defect_location: "$.context.defect_location"
                  repro_steps:     "$.context.repro_steps"
                outputs:
                  "$.context.base_commit":        base_commit
                  "$.context.impl_files_changed": impl_files_changed
                  "$.context.ws_verify":          ws_verify

      # DoD HANDOFF GATE — same shape as flow.implement.deliverable's
      # change_gate: proceed only when BOTH of flow.change's outcomes hold
      # (real files changed AND the regression verifier passed); the
      # unguarded `abort` is fail-closed defense-in-depth (flow.change already
      # routes any no-op / verifier-fail / unknown-stack to its own `failed`
      # terminal, which errors the `changing` transition above before this
      # gate is ever reached on an unmet DoD).
      change_gate:
        transitions:
          advance:
            target: reviewing
            actor: deterministic
            guards:
              - kind: expr
                expr: "$.context.impl_files_changed >= 1"
              - kind: expr
                expr: "$.context.ws_verify.status == 'pass'"
          abort:
            target: failed
            actor: deterministic

      reviewing:
        transitions:
          review:
            target: reviewed
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cap.review.adversarial
              use:
                inputs:
                  diff_against: "$.context.base_ref"
                outputs:
                  "$.context.review_verdict":  verdict
                  "$.context.review_findings": findings

      reviewed:
        transitions:
          advance:
            target: opening_pr
            actor: deterministic
            guards:
              - kind: expr
                expr: "$.context.review_verdict == 'approved'"
          abort:
            target: failed
            actor: deterministic
            guards:
              - kind: expr
                expr: "$.context.review_verdict == 'rejected'"
          unexpected:
            target: failed
            actor: deterministic

      opening_pr:
        transitions:
          open:
            target: done
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cap.coordinate.pr-open
              use:
                inputs:
                  title: "$.context.error_log"
                  body:  "$.context.error_log"
                  base:  "$.context.base_ref"
                outputs:
                  "$.context.pr_url":    url
                  "$.context.pr_number": pr_number

      done:
        terminal: true

      failed:
        terminal: true
        outcome: failure
